# Classic Hacker - Everforest Dark
command_timeout = 2000
scan_timeout = 1000
add_newline = true

format = """
[┌─](#859289)$directory$git_branch$git_status$git_state$nodejs$golang$rust$python$php$docker_context$cmd_duration
[└─](#859289)$character"""

right_format = ""

[character]
success_symbol = "[λ](bold #a7c080)"
error_symbol = "[λ](bold #e67e80)"
vimcmd_symbol = "[N](bold #7fbbb3)"
format = "$symbol "

[directory]
style = "bold #a7c080"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "#e67e80"

[git_branch]
symbol = " "
style = "#d699b6"
format = "[ $symbol$branch]($style)"

[git_status]
style = "#e67e80"
format = " [\\[$all_status$ahead_behind\\]]($style)"

[git_state]
style = "#e69875"
format = " [$state]($style)"

[nodejs]
symbol = " "
style = "#83c092"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "#7fbbb3"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "#e69875"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "#dbbc7f"
format = "[$symbol$version( $virtualenv)]($style) "

[php]
symbol = " "
style = "#d699b6"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "#7fbbb3"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "#859289"
format = " [$duration]($style)"

[time]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[kubernetes]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[terraform]
disabled = true

[java]
disabled = true

[c]
disabled = true

[elixir]
disabled = true
